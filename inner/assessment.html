<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnerSpace - 测评</title>
    <style>
        :root {
            --accent-color: #667eea;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.03);
        }
        .top-nav .logo {
            font-size: 20px;
            font-weight: 800;
            color: #2c3e50;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-nav .logo span { color: var(--accent-color); }
        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent-color); }

        /* Module Header */
        .module-header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .module-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        .module-title {
            font-size: 28px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .module-subtitle {
            font-family: monospace;
            font-size: 13px;
            color: #a0aec0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Progress Bar */
        .progress-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            overflow: hidden;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 12px;
            color: #a0aec0;
            font-weight: bold;
            font-family: monospace;
            min-width: 32px;
        }

        /* Main Content Area */
        .content-area {
            max-width: 640px;
            margin: 20px auto;
            padding: 0 20px 40px;
        }

        /* Cards (shared) */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Question Card */
        .question-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .round-badge {
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-color);
            background: rgba(102, 126, 234, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .topic-badge {
            font-size: 12px;
            color: #718096;
            background: #f7fafc;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }
        .question-text {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #edf2f7;
            border-radius: 14px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            font-size: 15px;
            color: #4a5568;
            font-family: inherit;
        }
        .option-btn:hover {
            border-color: var(--accent-color);
            background: rgba(102, 126, 234, 0.04);
            transform: translateX(6px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        .option-btn:active {
            transform: translateX(3px);
        }
        .option-label {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: #a0aec0;
            flex-shrink: 0;
            transition: all 0.25s;
        }
        .option-btn:hover .option-label {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }
        .option-text {
            flex: 1;
            line-height: 1.5;
        }

        /* Loading */
        .loading-card {
            text-align: center;
            padding: 60px 35px;
        }
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .loading-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .loading-text {
            color: #a0aec0;
            font-size: 14px;
        }

        /* Result Card */
        .result-card { text-align: center; }
        .result-header { margin-bottom: 20px; }
        .result-icon { font-size: 56px; margin-bottom: 10px; }
        .result-title {
            font-size: 24px;
            font-weight: 800;
            color: #2d3748;
        }
        .result-summary {
            font-size: 15px;
            color: #718096;
            line-height: 1.7;
            margin-bottom: 25px;
            text-align: left;
        }
        .result-type {
            background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            text-align: left;
        }
        .type-name {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        .type-desc {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.7;
        }

        /* Dimensions */
        .dimensions-list {
            text-align: left;
            margin-bottom: 25px;
        }
        .dimension-item {
            margin-bottom: 18px;
        }
        .dimension-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .dimension-name {
            font-size: 14px;
            font-weight: 700;
            color: #2d3748;
        }
        .dimension-score {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-color);
            font-family: monospace;
        }
        .dimension-bar {
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .dimension-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #764ba2);
            border-radius: 4px;
            transition: width 1s ease;
        }
        .dimension-desc {
            font-size: 13px;
            color: #718096;
            line-height: 1.5;
        }

        /* Advice */
        .result-advice {
            background: #f8fafc;
            border-left: 4px solid var(--accent-color);
            padding: 16px 20px;
            border-radius: 0 12px 12px 0;
            text-align: left;
            margin-bottom: 25px;
        }
        .result-advice h4 {
            font-size: 14px;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .result-advice p {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.7;
        }

        /* Action Buttons */
        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn-retry, .btn-home {
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-retry {
            background: var(--accent-color);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        .btn-home {
            background: white;
            color: #718096;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
        }
        .btn-home:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Error Card */
        .error-card {
            text-align: center;
            padding: 50px 35px;
        }
        .error-icon {
            font-size: 48px;
            color: #e53e3e;
            margin-bottom: 16px;
        }
        .error-card h3 {
            font-size: 20px;
            color: #2d3748;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
            word-break: break-all;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .module-header { padding: 30px 16px 16px; }
            .module-title { font-size: 22px; }
            .card { padding: 24px 20px; border-radius: 16px; }
            .question-text { font-size: 17px; }
            .option-btn { padding: 14px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="logo" href="index.html">🔮 Inner<span>Space</span></a>
        <a class="back-link" href="fragments.html">← 返回碎片空间</a>
    </nav>

    <div class="module-header">
        <span class="module-icon" id="module-icon">🧬</span>
        <h1 class="module-title" id="module-title">加载中...</h1>
        <span class="module-subtitle" id="module-subtitle">---</span>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0%</span>
    </div>

    <div class="content-area" id="content-area">
        <!-- Rendered by AssessmentEngine -->
    </div>

    <script src="js/llm-client.js"></script>
    <script src="js/prompts.js"></script>
    <script src="js/assessment-engine.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var moduleId = params.get('module') || 'core';
            var moduleConfig = window.MODULE_CONFIG[moduleId];

            if (!moduleConfig) {
                document.getElementById('content-area').innerHTML =
                    '<div class="card error-card">' +
                    '  <div class="error-icon">&#9888;</div>' +
                    '  <h3>未知模块</h3>' +
                    '  <p class="error-message">模块 "' + moduleId + '" 不存在。</p>' +
                    '  <a class="btn-home" href="fragments.html" style="display:inline-block;text-align:center;">返回碎片空间</a>' +
                    '</div>';
                return;
            }

            document.title = 'InnerSpace - ' + moduleConfig.title;
            var container = document.getElementById('content-area');
            AssessmentEngine.init(moduleConfig, container);

            // 优先级：1. 进行中的 session → 2. 已完成的结果 → 3. 全新开始
            var hasSession = false;
            try {
                var sessionData = localStorage.getItem('innerspace_session_' + moduleId);
                if (sessionData) hasSession = true;
            } catch (e) {}

            if (hasSession) {
                // 有进行中的测评，恢复到上次的题目
                AssessmentEngine.resume();
            } else {
                // 检查是否已有完成的结果
                var savedResult = null;
                try {
                    var stored = localStorage.getItem('innerspace_results');
                    if (stored) {
                        var results = JSON.parse(stored);
                        if (results[moduleId] && results[moduleId].data) {
                            savedResult = results[moduleId].data;
                        }
                    }
                } catch (e) {}

                if (savedResult) {
                    AssessmentEngine.showSavedResult(savedResult);
                } else {
                    AssessmentEngine.start();
                }
            }
        })();
    </script>
</body>
</html>
